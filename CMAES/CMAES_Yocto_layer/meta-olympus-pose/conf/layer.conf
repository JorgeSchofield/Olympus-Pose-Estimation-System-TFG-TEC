# Layer configuration for meta-olympus-pose
#
# Olympus rover — Pose Estimation subsystem (TFG, TEC/SETEC, ELANaV).
# Adds the CMAES pthreads backend to the existing Olympus HLC image.
#
# The collection is named "olympus-pose", not "olympus", because the rover's
# own layer (Alonso11/olympus-hlc-rpi5) already registers the collection
# "meta-olympus" from a directory called meta-olympus. Two layers cannot
# share a directory name inside layers/, and a shared collection name is a
# parse error. Keep this layer's directory named meta-olympus-pose.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "olympus-pose"
BBFILE_PATTERN_olympus-pose = "^${LAYERDIR}/"

# Higher than meta-olympus (10) so that the olympus-image.bbappend in this
# layer is applied after the rover layer's own metadata.
BBFILE_PRIORITY_olympus-pose = "11"

LAYERVERSION_olympus-pose = "1"

# Only oe-core. meta-raspberrypi and meta-openembedded are already in the
# rover's bblayers.conf, but nothing here needs them, so the recipe can also
# be built standalone or for qemuarm64.
LAYERDEPENDS_olympus-pose = "core"

# Matches LAYERSERIES_COMPAT_meta-olympus in the rover layer.
LAYERSERIES_COMPAT_olympus-pose = "scarthgap"
