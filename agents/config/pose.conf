# /etc/olympus-pose/pose.conf - olympus-pose configuration (agents/DESIGN.md §12)
#
# Two parts:
#   1. MODEL parameters (geo.*, ag.*, prm.*, and est.dt_source /
#      est.gyro_yaw_axis, which the model applies too). Generated by export_pose_conf.m
#      in the simulation model; required, the app refuses to start without
#      them. To recalibrate: edit the model parameter files, export, paste
#      the block below, restart. Never edit these values here by hand.
#   2. APPLICATION parameters (io.*, est.*, rt.*). Optional; the values shown
#      are the defaults.
#
# Check a file without starting:  olympus-pose -c pose.conf --check

# ======================================================================
# 1. MODEL PARAMETERS (from export_pose_conf.m)
# ======================================================================

# --- geo ---
geo.m_per_tick_R = -3.9455469349227593e-06
geo.m_per_tick_L = 3.9455674677772101e-06
geo.B_eff = 0.93300000000000005   # DER
geo.stop_ticks = 0

# --- ag ---
ag.gyro_scale = 0.00013323124061025417
ag.dt_reject = 2   # PROV
ag.dcount_reject = 20000   # PROV
ag.loop_ms = 20
ag.reset_window = 1000   # PROV
ag.k_reref = 3   # PROV
ag.n_still = 1   # PROV
ag.tilt_rollover = 0.52359877559829882   # PROV
ag.t_gap_max = 10   # PROV

# --- prm ---
prm.k_rho = 0.0001   # PROV
prm.s2_ds_floor = 1.2973132800000002e-12   # DER
prm.s2_theta = 1.5230870989335428e-06   # PROV
prm.s2_w_enc = 0.0012184696791468343   # PROV
prm.s2_bg = 3.9999999999999998e-06   # PROV
prm.r_gyro = 2.7415567780803768e-05   # PROV
prm.r_zaru = 7.6154354946677152e-07   # PROV
prm.slip_thresh = 0.10000000000000001   # TBD
prm.slip_gain = 20   # PROV
prm.slip_cap = 100
prm.dt_min = 0.001
prm.dt_max = 0.5
prm.P0 = 9.9999999999999995e-07 9.9999999999999995e-07 9.9999999999999995e-07 0.01 9.9999999999999995e-07

# --- est ---
est.dt_source = 0
est.gyro_yaw_axis = 2

# ======================================================================
# 2. APPLICATION PARAMETERS
# ======================================================================
# --- inputs and outputs ---
io.raw_input = /run/olympus/llc_raw     # pty B of llcmux (or a serial port, or a replay file)
io.raw_baud = 115200                    # only used if raw_input is a real serial port
io.replay = 0                           # 1: raw_input is a recorded file (or use -r FILE)
io.gps_port = /dev/ttyAMA0              # GPIO UART (GPIO15 = RX); empty = no GPS
io.gps_baud = 9600
io.udp_pose_host = 127.0.0.1            # pose datagrams (olympus-pose_gui.py or pose_listen.py)
io.udp_pose_port = 47001
io.udp_pose_host2 =                     # optional second destination (e.g. ground station)
io.udp_pose_port2 = 0
io.udp_ctrl_port = 47002                # control port on 127.0.0.1 (tools/pose_ctl.py); 0 = off
io.udp_gps_port = 47003                 # GPS fix datagrams to the pose host(s) (olympus-pose_gui.py); 0 = off
io.pose_decimation = 1                  # send every Nth estimate (logs keep all)
io.pose_frame = 1                       # axes of the published pose (datagram, pose.csv, GUI, RESET_POSE):
                                        # 1 = x right, y forward at start; 0 = x forward, y left (thesis
                                        # §2.1, the estimator's own frame). theta is the heading relative
                                        # to the start direction, CCW positive, in both (DESIGN.md §11.0)
io.log_dir = /var/lib/olympus-pose/runs # a run folder is created inside (persistent;
                                        # /var/log is in RAM on the rover image)

# --- estimation agent ---
est.t_init_s = 3.0                      # rest time before the pose is declared VALID
est.stale_ms = 100                      # no input for this long -> STALE
# est.dt_source and est.gyro_yaw_axis are in section 1: the model applies them
# too (hlc_fusion_inputs.m), so they come from sim_params and export_pose_conf.
#   est.dt_source: 0 = LLC tick (thesis), 1 = HLC arrival time from llcmux. Use 1
#   while the LLC firmware has no timer-based loop: its tick runs at ~53 % of
#   real time (stats.csv: llc_clock_scale). Set it in sim_params, re-export.
#   est.gyro_yaw_axis: IMU axis that points up, 0 x, 1 y, 2 z (sign in ag.gyro_scale).

# --- real-time scheduling (SCHED_FIFO; below the kernel IRQ threads at 50) ---
rt.prio_ams = 46
rt.prio_acq = 44
rt.prio_fus = 43
rt.prio_est = 42
rt.prio_com = 41
rt.prio_gps = 30
rt.cpu_pipeline = 3                     # -1 = do not pin
rt.cpu_gps = 2
